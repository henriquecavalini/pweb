<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVerde - Acesso à Conta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-leaf"></i> <span>EcoVerde</span></a>
      <nav class="nav-menu">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="ecopontos.html">EcoPontos</a>
        <a href="login.html" class="active">Acesso</a>
      </nav>
    </div>
  </header>

  <main class="container auth-container">
    
    <!-- Formulário 1: Login de Usuário -->
    <div class="card-form">
      <div class="card-header">
        <i class="fa-solid fa-right-to-bracket card-icon"></i>
        <h2>Acessar Conta</h2>
        <p>Informe suas credenciais para gerenciar suas coletas</p>
      </div>
      
      <form id="formLogin" action="backend/auth.php?acao=login" method="POST" novalidate>
        <div class="form-group">
          <label for="loginEmail">E-mail Cadastrado</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" name="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha de Acesso</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginSenha" name="senha" placeholder="••••••••" required>
          </div>
        </div>

        <div class="actions-group">
          <button type="submit" class="btn btn-success btn-full"><i class="fa-solid fa-sign-in-alt"></i> Entrar</button>
          <div class="sub-actions">
            <button type="button" id="btnAlterar" class="btn-text btn-warning"><i class="fa-solid fa-user-pen"></i> Alterar Dados</button>
            <button type="button" id="btnDeletar" class="btn-text btn-danger"><i class="fa-solid fa-user-xmark"></i> Excluir Conta</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Formulário 2: Cadastro com Coleta dos Dados Necessários -->
    <div class="card-form">
      <div class="card-header">
        <i class="fa-solid fa-user-plus card-icon"></i>
        <h2>Criar Nova Conta</h2>
        <p>Preencha os dados necessários para se cadastrar</p>
      </div>

      <form id="formCadastro" action="backend/auth.php?acao=cadastrar" method="POST" novalidate>
        <div class="form-group">
          <label for="cadastroNome">Nome Completo</label>
          <input type="text" id="cadastroNome" name="nome" placeholder="Ex: Maria Silva" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cadastroTelefone">WhatsApp / Telefone</label>
            <input type="tel" id="cadastroTelefone" name="telefone" placeholder="(16) 99999-9999" required>
          </div>

          <div class="form-group">
            <label for="cadastroEmail">E-mail</label>
            <input type="email" id="cadastroEmail" name="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="cadastroEndereco">Endereço Residencial (Rua, Nº, Bairro)</label>
          <input type="text" id="cadastroEndereco" name="endereco" placeholder="Ex: Av. Brasil, 1500 - Centro" required>
        </div>

        <div class="form-group">
          <label for="cadastroSenha">Senha (mínimo 6 caracteres)</label>
          <input type="password" id="cadastroSenha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="actions-group">
          <button type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-check-circle"></i> Concluir Cadastro</button>
          <button type="reset" class="btn btn-secondary btn-full"><i class="fa-solid fa-eraser"></i> Limpar Formulário</button>
        </div>
      </form>
    </div>

  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 EcoVerde - Segurança e Criptografia Hashing ativas.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
